<h1>Écrans v2 — après ta revue de copy</h1>
<div class="note">Appliqué: plus de "copy" (le défaut est muet), master = <b>"Master record" + #0</b>, artiste au recto, verso = 4 lignes enveloppe avec (i) chacune, "Learn more" pour les limites, "#N of M" partout, octothorpe réparé, "Quit". Donne tes retours par numéro d'écran.</div>
<div class="grid">
<figure><img src="screens-v2/01-library-master.png"><figcaption><b>1.</b> Library — master ("Master record", #0)</figcaption></figure>
<figure><img src="screens-v2/02-library-pressing.png"><figcaption><b>2.</b> Library — pressing (aucun label, juste #N of M)</figcaption></figure>
<figure><img src="screens-v2/03-library-2albums.png"><figcaption><b>3.</b> Library — 2 albums (séparateur • )</figcaption></figure>
