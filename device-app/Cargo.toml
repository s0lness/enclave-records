[package]
name = "presse"
version = "0.1.0"
authors = ["sylve"]
edition = "2021"

[dependencies]
ledger_device_sdk = {version = "*", features = ["io_new"]}
ledger_secure_sdk_sys = "*"

# Vendored copy carrying the home action-button support (candidate upstream
# PR to ledger-device-rust-sdk; keep the diff minimal and PR-shaped).
[patch.crates-io]
ledger_device_sdk = { path = "vendor/ledger_device_sdk" }

[build-dependencies]
# Decode the source GIFs and write the processed grayscale PNG glyph without
# pulling the full `image` crate (and its color-management stack). The luma
# conversion in build.rs reproduces `image::into_luma8()`.
gif = "0.14"
png = "0.18"

[features]
default = ["ledger_device_sdk/nano_nbgl"]
debug = ["ledger_device_sdk/debug"]
# Development screen probes, off by default: they are how the raw-NBGL paths
# were measured and filmed, and nothing a user does reaches them.
#
# Two features rather than one because they drive different things and a
# capture usually wants one of them. Flash leaves plenty of room for both at
# once (the per-app region is 400 KiB and the app uses about 20%), so
# `--features artprobe,uiprobe` builds fine. `artprobe` is ART_TEST and the raw
# `Screen` path behind it, which scripts/dev/art-test.sh and
# scripts/dev/show-sleeve.sh drive.
artprobe = []
# LIBRARY_PREVIEW and CARD_PREVIEW: synthetic library rows and record cards for
# states no ceremony can reach (three records, `#1000 of 1000`). Capture only.
uiprobe = []
# FACTORY_PROBE: one APDU onto the `os_factory_setting_get` syscall, whose ID
# space is documented nowhere public. Reads only, changes no state, and answers
# verbatim; it exists to find out whether the OS hands an app any factory
# material at all. Never ship it: an INS that returns raw OS bytes is exactly
# the surface a released app should not carry.
factprobe = []

[package.metadata.ledger]
curve = ["secp256k1"]
flags = "0"
path = ["44'/1'"]
name = "Enclave Records"
nanosplus = { icon = "icons/crab_14x14.gif" }
nanox = { icon = "icons/crab_14x14.gif" }
stax = { icon = "icons/vinyl_32x32.gif" }
flex = { icon = "icons/vinyl_40x40.gif" }
apex_p = { icon = "icons/crab_32x32.png" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("apex_p", "stax", "flex", "nanos", "nanox", "nanosplus"))'] }
